services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-go_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-go_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    command: ["migrate"]
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      APP_PORT: "8080"
      EXPORT_DIR: /app/storage/exports
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - exports:/app/storage/exports
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
  exports: